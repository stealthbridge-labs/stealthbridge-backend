name: Protected SQLx staging migration gate
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inspect pending SQLx migrations, or apply to an independently configured Neon staging branch"
        type: choice
        options:
          - inspect
          - apply
        default: inspect
        required: true
      confirmation:
        description: "For apply only, type APPLY_STAGING_ONLY"
        type: string
        required: false
permissions:
  contents: read
jobs:
  staging-sqlx:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 18
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate additive SQLx file source and readiness parity
        run: |
          python3 scripts/validate_migrations.py
          python3 -m unittest scripts/test_validate_migrations.py
      - name: Require an isolated staging database secret
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "Protected staging environment lacks STAGING_DATABASE_URL" >&2
            exit 1
          fi
      - name: Install reviewed SQLx 0.8 CLI
        run: cargo install --locked --version 0.8.6 sqlx-cli --no-default-features --features postgres,rustls
      - name: Inspect applied and pending schema versions
        run: sqlx migrate info --source migrations
      - name: Require explicit second confirmation for staging-only DDL
        if: inputs.mode == 'apply'
        env:
          APPROVAL_TEXT: ${{ inputs.confirmation }}
        run: |
          if [ "${APPROVAL_TEXT:-}" != 'APPLY_STAGING_ONLY' ]; then
            echo "Type APPLY_STAGING_ONLY after selecting the correct Neon staging branch" >&2
            exit 1
          fi
      - name: Apply additive reviewed migrations (explicit staging authorization only)
        if: inputs.mode == 'apply'
        run: sqlx migrate run --source migrations
      - name: Verify post-apply registered SQLx migrations
        if: inputs.mode == 'apply'
        run: sqlx migrate info --source migrations
