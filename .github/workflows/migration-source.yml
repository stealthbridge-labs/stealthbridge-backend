name: Additive SQLx schema drift checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  migration-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate all SQLx migrations against deployed API readiness list
        run: python3 scripts/validate_migrations.py
      - name: Reject missing marker or unreviewed mutating SQL
        run: python3 -m unittest scripts/test_validate_migrations.py
