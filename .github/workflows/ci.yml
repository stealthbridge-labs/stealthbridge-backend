name: Rust API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stealthbridge_ci
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: stealthbridge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stealthbridge_ci -d stealthbridge_ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://stealthbridge_ci:test_only@localhost:5432/stealthbridge_ci
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Enforce read-only published OpenAPI methods
        run: python3 scripts/verify_readonly_openapi.py
      - name: Regression-test API write and schema drift gates
        run: python3 -m unittest scripts/test_verify_readonly_openapi.py
      - run: cargo fmt --all
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test live-ledger freshness and safe degraded behavior
        run: python3 -m unittest scripts/test_smoke_testnet_http.py
      - name: Regression tests for canonical manifest and consumer API compatibility
        run: python3 -m unittest scripts/test_manifest_parity.py scripts/test_verify_consumer_contracts.py
      - name: Check backend API against pinned SDK and frontend source
        env:
          STEALTHBRIDGE_SDK_REF: 1cd88fb1db81a2c30167babe71484963dd5287e7
          STEALTHBRIDGE_FRONTEND_REF: 2f2edaa6ae5c653d9acae12f9ec5dea6161b9bcc
        run: python3 scripts/verify_consumer_contracts.py
      - name: Verify deployment snapshot matches pinned undeployed contracts source
        env:
          STEALTHBRIDGE_CONTRACTS_REF: 4c01631028bde15385a0e73e39c5c635dca17b35
        run: python3 scripts/verify_manifest.py
