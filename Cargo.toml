[package]
name = "stealthbridge-backend"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "macros"] }
uuid = { version = "1", features = ["serde", "v4"] }

hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }

# Official Vercel Rust Functions adapter; local Axum binary remains unchanged.
vercel_runtime = { version = "2.4", features = ["axum"] }
tower = "0.5"

[[bin]]
name = "main"
path = "api/axum.rs"

# Local Axum server and observer are intentionally distinct processes.
[[bin]]
name = "api-server"
path = "src/main.rs"

[[bin]]
name = "ledger-observer"
path = "src/bin/ledger-observer.rs"
